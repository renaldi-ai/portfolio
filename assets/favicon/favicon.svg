<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6d5bf0"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>

  <!-- Circuit / IoT node accents -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M14 22 L14 14 L22 14"/>
    <path d="M86 22 L86 14 L78 14"/>
    <path d="M14 78 L14 86 L22 86"/>
  </g>
  <circle cx="14" cy="14" r="2.6" fill="#ffffff" fill-opacity="0.55"/>
  <circle cx="86" cy="14" r="2.6" fill="#ffffff" fill-opacity="0.55"/>
  <circle cx="14" cy="86" r="2.6" fill="#ffffff" fill-opacity="0.55"/>
  <circle cx="86" cy="80" r="2.2" fill="#ffffff" fill-opacity="0.4"/>

  <!-- Letter R -->
  <text x="50" y="70" font-family="Poppins, Arial, sans-serif" font-size="52" font-weight="700"
        text-anchor="middle" fill="url(#letterGrad)">R</text>

  <!-- Small signal dot accent (IoT motif), bottom-right of the R -->
  <circle cx="68" cy="68" r="4.5" fill="#34d399"/>
  <circle cx="68" cy="68" r="4.5" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.4"/>
</svg>
